<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Neon</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel2: #171b26;
    --text: #e8eaf0;
    --muted: #8b91a5;
    --cyan: #00e5ff;
    --violet: #a855f7;
    --line: rgba(0, 229, 255, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1100px 550px at 75% -10%, rgba(168, 85, 247, 0.13), transparent),
      radial-gradient(900px 500px at 8% 110%, rgba(0, 229, 255, 0.10), transparent),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 20px; letter-spacing: 6px; color: var(--cyan);
    text-shadow: 0 0 14px rgba(0, 229, 255, 0.55), 0 0 40px rgba(0, 229, 255, 0.25);
  }
  header .tag { color: var(--muted); font-size: 12px; }
  #nowplaying {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 22px; background: var(--panel);
    border-bottom: 1px solid rgba(168, 85, 247, 0.2);
  }
  #np-info { flex: 1; min-width: 0; }
  #np-track { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np-artist { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; font-size: 16px;
    width: 42px; height: 38px; transition: all 0.15s;
  }
  .ctl:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.35); }
  .ctl.on { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
  #volume { width: 110px; accent-color: var(--violet); }
  #chat { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: rgba(0, 229, 255, 0.12); border: 1px solid rgba(0, 229, 255, 0.3); border-bottom-right-radius: 4px; }
  .msg.dj { align-self: flex-start; background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.3); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: none; border: none; }
  #inputbar { display: flex; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--panel); }
  #input {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); padding: 12px 14px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 229, 255, 0.25); }
  #send {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(168, 85, 247, 0.2));
    color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 20px; font-size: 15px; cursor: pointer; transition: all 0.15s;
  }
  #send:hover { border-color: var(--violet); box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.ok { background: #2fe08a; box-shadow: 0 0 8px rgba(47, 224, 138, 0.8); }
  .dot.ko { background: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>DJ NEON</h1>
  <span class="tag"><span class="dot ok" id="status-dot"></span><span id="status-text">connexion…</span></span>
</header>

<div id="nowplaying">
  <button class="ctl" id="btn-prev" title="Morceau précédent">⏮</button>
  <button class="ctl" id="btn-toggle" title="Lecture / pause">⏯</button>
  <button class="ctl" id="btn-next" title="Morceau suivant">⏭</button>
  <button class="ctl" id="btn-shuffle" title="Mode aléatoire">🔀</button>
  <div id="np-info">
    <div id="np-track">—</div>
    <div id="np-artist">Rien en cours</div>
  </div>
  <input type="range" id="volume" min="0" max="100" value="50" title="Volume">
</div>

<div id="chat"></div>

<div id="inputbar">
  <input id="input" type="text" placeholder="Demande quelque chose à DJ Neon…" autocomplete="off">
  <button id="send">Envoyer</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const state = { playing: false, shuffle: null };

function addBubble(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  return res.json();
}

async function send() {
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  addBubble(message, "user");
  addBubble("…", "dj temp");
  const data = await post("/api/chat", { message });
  const temp = document.querySelector(".msg.temp");
  if (temp) temp.remove();
  if (data.error) addBubble("⚠️ " + data.error, "sys");
  else addBubble(data.reply || "(réponse vide)", "dj");
  refreshState();
}

async function control(action, value) {
  const data = await post("/api/control", { action, value });
  if (data.error) addBubble("⚠️ " + data.error, "sys");
  refreshState();
}

async function refreshState() {
  try {
    const res = await fetch("/api/state");
    const s = await res.json();
    state.playing = s.playing;
    state.shuffle = s.shuffle;
    document.getElementById("np-track").textContent = s.track || "—";
    document.getElementById("np-artist").textContent = s.artist || "Rien en cours";
    document.getElementById("btn-shuffle").classList.toggle("on", !!s.shuffle);
    if (s.error) {
      document.getElementById("status-dot").className = "dot ko";
      document.getElementById("status-text").textContent = "Spotify : " + s.error;
    } else {
      document.getElementById("status-dot").className = "dot ok";
      document.getElementById("status-text").textContent = "Spotify connecté";
    }
  } catch (e) {
    document.getElementById("status-dot").className = "dot ko";
    document.getElementById("status-text").textContent = "Spotify injoignable";
  }
}

document.getElementById("send").addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.getElementById("btn-prev").addEventListener("click", () => control("previous"));
document.getElementById("btn-next").addEventListener("click", () => control("next"));
document.getElementById("btn-toggle").addEventListener("click", () => control(state.playing ? "pause" : "resume"));
document.getElementById("btn-shuffle").addEventListener("click", () => control("shuffle", !state.shuffle));
document.getElementById("volume").addEventListener("change", (e) => control("volume", Number(e.target.value)));

addBubble("Bienvenue à bord ! Je suis DJ Neon, ta radio personnelle. Demande-moi une playlist, un artiste, un titre…", "dj");
refreshState();
setInterval(refreshState, 5000);
input.focus();
</script>
</body>
</html>
